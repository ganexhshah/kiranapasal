services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: krm_backend_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-krm_db}
      DB_USERNAME: ${DB_USERNAME:-krm_user}
      DB_PASSWORD: ${DB_PASSWORD:-krm_secret_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - krm_network

  nginx:
    image: nginx:1.25-alpine
    container_name: krm_backend_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certs_data:/etc/letsencrypt:ro
    depends_on:
      - app
      - reverb
    networks:
      - krm_network

  postgres:
    image: postgres:16-alpine
    container_name: krm_backend_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-krm_db}
      POSTGRES_USER: ${DB_USERNAME:-krm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-krm_secret_password}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sh:/docker-entrypoint-initdb.d/init-extensions.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-krm_user} -d ${DB_DATABASE:-krm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - krm_network

  redis:
    image: redis:7.2-alpine
    container_name: krm_backend_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - krm_network

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: krm_backend_horizon
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "horizon"]
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - krm_network

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: krm_backend_reverb
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-production}
      REDIS_HOST: redis
    depends_on:
      - redis
    networks:
      - krm_network

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: krm_backend_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["sh", "-c", "while [ true ]; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"]
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
    networks:
      - krm_network

  backup:
    image: postgres:16-alpine
    container_name: krm_backend_backup
    restart: unless-stopped
    volumes:
      - ./docker/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - backup_data:/backups
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${DB_DATABASE:-krm_db}
      PGUSER: ${DB_USERNAME:-krm_user}
      PGPASSWORD: ${DB_PASSWORD:-krm_secret_password}
      R2_BUCKET_NAME: ${CLOUDFLARE_R2_BUCKET:-protofilo}
      R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID:-80077dcf329a6b01c33e2c44b2b31e9b}
      R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-506cbfc47728c0c24cb2756620e9936fcddd35f0ed9c633102454c6ddb86f2b4}
      R2_ENDPOINT_URL: ${CLOUDFLARE_R2_ENDPOINT:-https://516d4d7c8a274b7f897979999bcb096b.r2.cloudflarestorage.com}
    entrypoint: ["sh", "-c", "apk add --no-cache aws-cli && echo '0 2 * * * /usr/local/bin/backup.sh' > /etc/crontabs/root && crond -f -l 2"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - krm_network

networks:
  krm_network:
    driver: bridge

volumes:
  postgres_data:
    name: krm_postgres_data
  redis_data:
    name: krm_redis_data
  certs_data:
    name: krm_certs_data
  backup_data:
    name: krm_backup_data

